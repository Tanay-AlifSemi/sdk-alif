CONFIG_ZTEST=y
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=8192

CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_REGULATOR=y
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_WINDOW_ALIGNMENT=512
# Do not format onboard eMMC if mount fails.
CONFIG_FS_FATFS_MOUNT_MKFS=n

CONFIG_SDHC=y
CONFIG_SDHC_DWC=y
CONFIG_SDHC_DWC_ADMA=y
CONFIG_SDHC_RSP_136_HAS_CRC=y
CONFIG_SDHC_INIT_PRIORITY=80
